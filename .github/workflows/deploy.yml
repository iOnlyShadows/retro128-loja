# Publica a loja no GitHub Pages.
#  - A cada push na branch main, publica a versão atual (deploy normal).
#  - Pela aba Actions > "Deploy no GitHub Pages" > "Run workflow" é possível
#    publicar QUALQUER versão anterior (tag, branch ou commit): é o nosso ROLLBACK.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (tag como v1.0.0, branch ou SHA). Vazio = main"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.sha }}

      - name: Carimbar a versão publicada (build-info.json)
        env:
          REF_PUBLICADA: ${{ inputs.versao || github.ref_name }}
          EVENTO: ${{ github.event_name }}
          EXECUCAO: ${{ github.run_number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ref":"%s","commit":"%s","dataDeploy":"%s","evento":"%s","execucao":"%s"}\n' \
            "$REF_PUBLICADA" "$COMMIT" "$DATA" "$EVENTO" "$EXECUCAO" > build-info.json
          echo "Publicando $REF_PUBLICADA (commit $COMMIT) — evento: $EVENTO"
          cat build-info.json

      - name: Validar a release (bloqueia o deploy se algo estiver errado)
        shell: python
        run: |
          import json, os, sys

          erros = []
          with open("config/app-config.json", encoding="utf-8") as f:
              config = json.load(f)
          with open(config["catalogoUrl"], encoding="utf-8") as f:
              jogos = json.load(f)["jogos"]

          # 1) Toda capa citada no catálogo existe na pasta configurada
          pasta = config["pastaCapas"]
          for jogo in jogos:
              caminho = os.path.join(pasta, jogo["capa"])
              if not os.path.isfile(caminho):
                  erros.append(f"capa ausente: {caminho} (jogo {jogo['id']})")

          # 2) Toda promoção aponta para um jogo que existe no catálogo
          ids = {j["id"] for j in jogos}
          for id_promo in config.get("blackFriday", {}).get("promocoes", {}):
              if id_promo not in ids:
                  erros.append(f"promoção para jogo inexistente: {id_promo}")

          if erros:
              print(f"::error::Release bloqueada: {len(erros)} problema(s) encontrado(s)")
              for e in erros:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"Release aprovada: {len(jogos)} capas encontradas em {pasta}")

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
